name: OSINT X Scraper

on:
  schedule:
    # Lance tous les jours à 5h00 UTC (6h Paris heure d'hiver, 7h été)
    - cron: '0 5 * * *'
  # Permet aussi de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: python scraper.py

      - name: Commit et push tweets.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets.json
          git diff --staged --quiet || git commit -m "Update tweets.json $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
